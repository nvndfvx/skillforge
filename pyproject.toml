[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge"
version = "0.5.0"
description = "观察人类操作 → 蒸馏参数化技能 → 沙箱执行 → 异常自愈（纵向调优）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SkillForge" }]
keywords = ["rpa", "browser-automation", "playwright", "self-healing", "skill-distillation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.44"]

[project.scripts]
skillforge = "skillforge.cli:main"

[tool.setuptools.packages.find]
include = ["skillforge*"]
