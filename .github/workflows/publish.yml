name: publish

# 首发到 PyPI 用**手动触发**：PyPI 那边还没配置 trusted publisher 之前，
# 挂上 tag 触发只会让发布变红，看不出到底是代码问题还是配置没做完。
#
# 等 PyPI 上配好之后，把下面注释里的 push 两行打开，就能打 tag 自动发：
#
# on:
#   push:
#     tags: ["v*"]
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC：不需要任何 PyPI token，也不存任何密钥

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # 这个 environment 名要和 PyPI 上 Trusted Publisher 里填的一致
    environment:
      name: pypi
      url: https://pypi.org/p/skillforge-engine
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # 只用 OIDC 换短期令牌，不需要 password / api-token
