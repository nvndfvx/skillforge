name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    name: offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 离线测试零第三方依赖；test_js_capture 用 node --check 做 JS 语法校验，
      # GitHub runner 自带 node。
      - name: Run offline tests
        run: python tests/run_all.py
